# See https://pre-commit.com for more information
# Install with: uv run pre-commit install
# Run on everything once with: uv run pre-commit run --all-files

repos:
  # Fundamental hygiene hooks for a Python project.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending

  # Lint + format Python. rev tracks the ruff pin in pyproject.toml
  # ([dependency-groups].dev) so the hook and local runs agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Keep uv.lock in sync with pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.10
    hooks:
      - id: uv-lock

  # Full test suite — fast enough to run on every commit.
  - repo: local
    hooks:
      - id: pytest
        name: pytest (peekaboo-vl test suite)
        entry: uv run pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
